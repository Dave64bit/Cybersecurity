<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .login-box {
            width: 320px;
            padding: 30px;

            background-color: #ffffff;
            border: 1px solid #bdbdbd;
            border-radius: 8px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .login-box h2 {
            margin-top: 0;
            text-align: center;
            color: #333333;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;

            border: 1px solid #bdbdbd;
            border-radius: 4px;

            box-sizing: border-box;
            font-size: 14px;
        }

        .login-box button {
            width: 100%;
            padding: 10px;

            border: none;
            border-radius: 4px;

            background-color: #666666;
            color: white;

            font-size: 14px;
            cursor: pointer;
        }

        .login-box button:hover {
            background-color: #555555;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Login</h2>

        <form method="POST" action="login.php">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>
    </div>

</body>
</html>
